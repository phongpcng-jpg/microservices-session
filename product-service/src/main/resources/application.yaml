spring:
  application:
    name: product-service

  datasource:
    url: ${PRODUCT_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${PRODUCT_USERNAME:postgres}
    password: ${PRODUCT_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PRODUCT_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
spring:
  application:
    name: customer-service

  datasource:
    url: ${CUSTOMER_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${CUSTOMER_USERNAME:postgres}
    password: ${CUSTOMER_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  customer-api:
    enabled: false
  customer-api-v1:
    enabled: true

server:
  port: ${CUSTOMER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
